schema: spec-driven

context: |
  Potato Clicker: an original incremental/idle browser game themed around potatoes.
  Tech stack: vanilla HTML/CSS/ES modules, no build step, no runtime dependencies.
  Deployed as a static site on GitHub Pages.
  Game logic lives in pure modules (no DOM) so it can be unit-tested with `node --test`.
  We use conventional commits.

rules:
  tasks:
    - Every task that adds game logic must have a matching node:test unit test
